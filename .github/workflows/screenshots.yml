# Visual check for branches: builds the site against a seeded throwaway database and saves
# screenshots (Arabic + English, desktop + mobile, plus frames of the hero logo animation) as a
# downloadable artifact on the run page. Run it by hand with `base_url` to capture a deployed
# site instead (read-only page visits; nothing is built).
name: Screenshots

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Capture this deployed site instead of building the branch (e.g. https://grams-gym-qtww.vercel.app)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}-${{ inputs.base_url }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for a local test database; nothing here is a real secret.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Database with plans and demo products
        if: ${{ !inputs.base_url }}
        run: npx prisma db push --skip-generate && npm run db:seed
      - if: ${{ !inputs.base_url }}
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the site
        if: ${{ !inputs.base_url }}
        run: |
          npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ar && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Take screenshots
        run: node scripts/screenshots.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
      - if: failure() && !inputs.base_url
        run: cat "$RUNNER_TEMP/server.log" || true
