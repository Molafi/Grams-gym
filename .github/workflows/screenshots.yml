# Visual check for branches: builds the site against a seeded throwaway database and saves
# screenshots (Arabic + English, desktop + mobile) as a downloadable artifact on the run page.
name: Screenshots

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for a local test database; nothing here is a real secret.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Database with plans and demo products
        run: npx prisma db push --skip-generate && npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the site
        run: |
          npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ar && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Take screenshots
        run: |
          # Written into the checkout (not committed) so `@playwright/test` resolves from node_modules.
          cat > shots.mjs <<'EOF'
          import { chromium } from "@playwright/test";
          import { mkdirSync } from "node:fs";

          const base = "http://localhost:3000";
          const out = "screenshots";
          mkdirSync(out, { recursive: true });
          // SwiftShader gives headless Chromium WebGL, so the 3D hero renders too.
          const browser = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader", "--ignore-gpu-blocklist"] });
          const viewports = {
            desktop: { viewport: { width: 1440, height: 900 } },
            mobile: { viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true },
          };
          const pages = [
            ["home", "/"],
            ["packages", "/packages"],
            ["contact", "/contact"],
            ["product", "/shop/demo-forge-whey"],
          ];
          for (const [device, opts] of Object.entries(viewports)) {
            for (const motion of ["normal", "reduce"]) {
              const context = await browser.newContext({ ...opts, reducedMotion: motion });
              const page = await context.newPage();
              for (const locale of ["ar", "en"]) {
                for (const [name, path] of pages) {
                  // Reduced motion shows the static poster (logo image) instead of 3D: only needed for the hero.
                  if (motion === "reduce" && name !== "home") continue;
                  await page.goto(`${base}/${locale}${path}`, { waitUntil: "networkidle" });
                  await page.waitForTimeout(6000); // idle callback + 3D fade-in
                  const tag = motion === "reduce" ? "-poster" : "";
                  await page.screenshot({ path: `${out}/${name}${tag}-${locale}-${device}-top.png` });
                  if (motion === "normal") await page.screenshot({ path: `${out}/${name}-${locale}-${device}-full.png`, fullPage: true });
                  console.log("saved", name, locale, device, motion);
                }
              }
              await context.close();
            }
          }
          await browser.close();
          EOF
          node shots.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true
