# Runs on every push: the same checks Vercel's build depends on, plus a check that the SQL files in
# prisma/changes/ bring a database at main's schema exactly to this branch's prisma/schema.prisma.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders: lib/env.ts validates these at build time; nothing connects to them.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  schema:
    name: Database change applies cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: SQL generated by Prisma (main's schema → this branch)
        run: |
          git show origin/main:prisma/schema.prisma > "$RUNNER_TEMP/main.prisma"
          npx prisma migrate diff --from-schema-datamodel "$RUNNER_TEMP/main.prisma" --to-schema-datamodel prisma/schema.prisma --script
      - name: A database at main's schema (stands in for production)
        run: npx prisma db push --schema "$RUNNER_TEMP/main.prisma" --skip-generate
      - name: Pre-check, same command as against Neon (what the database still needs)
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --script
      - name: Apply the change files added on this branch
        run: |
          for f in $(git diff --name-only --diff-filter=A origin/main...HEAD -- 'prisma/changes/*.sql'); do
            echo "== $f"
            npx prisma db execute --schema prisma/schema.prisma --file "$f"
          done
      - name: The database now matches prisma/schema.prisma exactly
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
